# Прод-оркестрация (T-I04, EP-ONPREM «single-command deploy»): postgres + redis + minio +
# миграции + api + web одним артефактом.  Запуск:  JWT_SECRET=... docker compose -f docker-compose.prod.yml up -d --build
# Демо-данные не сеются (prod). Внешние SMTP/SSO — через env api (см. .env.example).

name: it-audit-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-audit}
      POSTGRES_DB: audit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audit -d audit']
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-audit-files}
      "
    restart: 'no'

  # One-shot: применяет миграции (создаёт схему + роль app + RLS), затем завершается.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "cd apps/api && node_modules/.bin/drizzle-kit migrate"
    environment:
      DATABASE_URL_OWNER: postgres://audit:${DB_PASSWORD:-audit}@postgres:5432/audit
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3001
      DATABASE_URL: postgres://app:app@postgres:5432/audit
      DATABASE_URL_OWNER: postgres://audit:${DB_PASSWORD:-audit}@postgres:5432/audit
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-audit-files}
      JWT_SECRET: ${JWT_SECRET:?требуется JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-3001}:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:3001
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  pgdata:
  redisdata:
  miniodata:
