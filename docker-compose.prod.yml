# Прод-оркестрация (T-I04, EP-ONPREM «single-command deploy»): postgres + redis + minio +
# миграции + api + web одним артефактом.  Запуск:  JWT_SECRET=... docker compose -f docker-compose.prod.yml up -d --build
# Демо-данные не сеются (prod). Внешние SMTP/SSO — через env api (см. .env.example).

name: it-audit-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-audit}
      POSTGRES_DB: audit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audit -d audit']
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 15

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-audit-files}
      "
    restart: 'no'

  # One-shot: применяет миграции (создаёт схему + роль app + RLS), затем завершается.
  migrate:
    image: it-audit-prod-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "cd apps/api && node_modules/.bin/drizzle-kit migrate"
    environment:
      DATABASE_URL_OWNER: postgres://audit:${DB_PASSWORD:-audit}@postgres:5432/audit
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # One-shot: референс-данные (роли/фреймворки вкл. CBAR/контроли) + первый admin из
  # BOOTSTRAP_* (T-I07). Без BOOTSTRAP_* — только референс. Демо-данные не сеются.
  bootstrap:
    image: it-audit-prod-bootstrap:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "cd apps/api && node dist/bootstrap.js"
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/audit
      DATABASE_URL_OWNER: postgres://audit:${DB_PASSWORD:-audit}@postgres:5432/audit
      BOOTSTRAP_TENANT_SLUG: ${BOOTSTRAP_TENANT_SLUG:-}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  api:
    image: it-audit-prod-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3001
      DATABASE_URL: postgres://app:app@postgres:5432/audit
      DATABASE_URL_OWNER: postgres://audit:${DB_PASSWORD:-audit}@postgres:5432/audit
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-audit-files}
      JWT_SECRET: ${JWT_SECRET:?требуется JWT_SECRET}
      # Шифрование секретов (коннекторы T-048, per-tenant ключи ИИ T-H23) — в проде обязателен свой
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?требуется ENCRYPTION_KEY}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # LLM деплой-дефолт (EP-AI): по умолчанию off; per-tenant override — в UI /ai-settings
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-4-8}
      AI_BASE_URL: ${AI_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-3001}:3001'

  web:
    image: it-audit-prod-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:3001
      # Протокол APP_URL определяет Secure-флаг session-куки (http → без Secure, иначе логин зациклен на HTTP)
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  pgdata:
  redisdata:
  miniodata:
