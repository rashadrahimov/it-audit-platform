name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Инфраструктура интеграционных тестов (rls/rbac/deactivation + seed).
    # Порты как в docker-compose: 5433/6380 — дефолты кода без .env.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # MinIO не запускается как service (нужна команда `server /data`) — руками.
      # Бакет создаёт сам seed, mc-init не нужен.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break; sleep 1;
          done

      # Mailpit (SMTP :1025 + HTTP API :8025) — нужен e2e magic-link (T-H38):
      # реальная отправка письма и вычитывание одноразовой ссылки из ящика.
      - name: Start Mailpit
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 \
            axllent/mailpit:v1.27
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/api/v1/messages >/dev/null && break; sleep 1;
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build первым: shared собирается в dist, его типы нужны typecheck/test остальных
      - name: Build
        run: pnpm build

      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # E2E (T-H26): сквозной smoke через реальный браузер. Инфра (db/redis/minio + seed)
      # уже поднята выше; поднимаем api+web и гоняем Playwright против них.
      - name: Install Playwright browser
        run: pnpm --filter @it-audit/web exec playwright install --with-deps chromium

      - name: Start servers for E2E
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          pnpm --filter @it-audit/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health >/dev/null \
              && curl -sf http://localhost:3000 >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3001/health >/dev/null || { echo 'api не поднялся'; cat /tmp/api.log; exit 1; }
          curl -sf http://localhost:3000 >/dev/null || { echo 'web не поднялся'; cat /tmp/web.log; exit 1; }

      - name: E2E (Playwright smoke)
        run: pnpm --filter @it-audit/web test:e2e

  # Прод-образы (T-I05): проверяем, что оба Dockerfile'а собираются и prod-compose валиден.
  # Отдельный job — параллельно ci, не блокирует тесты.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t it-audit-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t it-audit-web:ci .

      - name: Validate prod compose
        run: JWT_SECRET=ci-validate ENCRYPTION_KEY=ci-validate docker compose -f docker-compose.prod.yml config >/dev/null
