name: Deploy (Cloud Run)

# Production deployment starts only after the complete main-branch CI succeeds.
# A manual run remains available for a controlled redeploy of an exact ref.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (defaults to main)'
        required: false
        default: 'main'

concurrency:
  group: production-cloud-run-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  API_SERVICE: it-audit-api
  WEB_SERVICE: it-audit-web
  MIGRATION_JOB: it-audit-migrate
  DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION ARTIFACT_REPOSITORY WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT; do
            test -n "${!name:-}" || { echo "::error::$name is missing"; exit 1; }
          done

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0

      - name: Resolve immutable release SHA
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable images
        id: images
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}"
          api_image="${registry}/it-audit-api:${RELEASE_SHA}"
          web_image="${registry}/it-audit-web:${RELEASE_SHA}"

          docker build --pull -f apps/api/Dockerfile -t "$api_image" .
          docker build --pull -f apps/web/Dockerfile -t "$web_image" .
          docker push "$api_image"
          docker push "$web_image"

          echo "api=$api_image" >> "$GITHUB_OUTPUT"
          echo "web=$web_image" >> "$GITHUB_OUTPUT"

      - name: Capture rollback revisions
        id: rollback
        run: |
          set -euo pipefail
          api_revision=$(gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -er '[.status.traffic[] | select(.percent == 100) | .revisionName][0]')
          web_revision=$(gcloud run services describe "$WEB_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -er '[.status.traffic[] | select(.percent == 100) | .revisionName][0]')
          test -n "$api_revision"
          test -n "$web_revision"
          echo "api=$api_revision" >> "$GITHUB_OUTPUT"
          echo "web=$web_revision" >> "$GITHUB_OUTPUT"

      - name: Run database migrations as a separate Cloud Run job
        run: |
          set -euo pipefail
          gcloud run jobs update "$MIGRATION_JOB" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${{ steps.images.outputs.api }}" \
            --quiet
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project "$PROJECT_ID" --region "$REGION" \
            --wait --quiet

      - name: Deploy API and verify authenticated health
        id: api
        run: |
          set -euo pipefail
          gcloud run deploy "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${{ steps.images.outputs.api }}" \
            --service-account "it-audit-api@${PROJECT_ID}.iam.gserviceaccount.com" \
            --port 3001 --cpu 1 --memory 512Mi --concurrency 10 --timeout 60 \
            --min-instances 0 --max-instances 1 \
            --no-allow-unauthenticated --no-traffic --quiet

          api_revision=$(gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')
          api_ready=$(gcloud run revisions describe "$api_revision" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.conditions[0].status)')
          test -n "$api_revision"
          test "$api_ready" = "True"

          gcloud run services update-traffic "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --update-tags "candidate=$api_revision" --quiet

          api_url=$(gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          candidate_url=$(gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          test -n "$candidate_url"
          identity_token=$(gcloud auth print-identity-token \
            --impersonate-service-account="$DEPLOY_SERVICE_ACCOUNT" \
            --audiences="$api_url")
          curl --fail --show-error --silent --retry 5 --retry-all-errors \
            -H "X-Serverless-Authorization: Bearer ${identity_token}" \
            "${candidate_url}/health" >/dev/null

          gcloud run services update-traffic "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --remove-tags candidate --to-revisions "$api_revision=100" --quiet
          serving=$(gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -er '[.status.traffic[] | select(.percent == 100) | .revisionName][0]')
          test "$serving" = "$api_revision"
          echo "revision=$api_revision" >> "$GITHUB_OUTPUT"

      - name: Deploy web and verify the ready revision
        id: web
        run: |
          set -euo pipefail
          gcloud run deploy "$WEB_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "${{ steps.images.outputs.web }}" \
            --service-account "it-audit-web@${PROJECT_ID}.iam.gserviceaccount.com" \
            --port 3000 --cpu 1 --memory 512Mi --concurrency 10 --timeout 60 \
            --min-instances 0 --max-instances 1 \
            --no-allow-unauthenticated --no-traffic --quiet

          web_revision=$(gcloud run services describe "$WEB_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')
          web_ready=$(gcloud run revisions describe "$web_revision" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.conditions[0].status)')
          test -n "$web_revision"
          test "$web_ready" = "True"

          gcloud run services update-traffic "$WEB_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "$web_revision=100" --quiet
          serving=$(gcloud run services describe "$WEB_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -er '[.status.traffic[] | select(.percent == 100) | .revisionName][0]')
          test "$serving" = "$web_revision"
          echo "revision=$web_revision" >> "$GITHUB_OUTPUT"

      - name: Roll back traffic after a failed release
        if: failure() && steps.rollback.outputs.api != '' && steps.rollback.outputs.web != ''
        run: |
          set -euo pipefail
          api_rollback_args=(--to-revisions "${{ steps.rollback.outputs.api }}=100")
          if gcloud run services describe "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --format=json \
            | jq -e 'any(.status.traffic[]?; .tag == "candidate")' >/dev/null; then
            api_rollback_args+=(--remove-tags candidate)
          fi
          gcloud run services update-traffic "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            "${api_rollback_args[@]}" --quiet
          gcloud run services update-traffic "$WEB_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --to-revisions "${{ steps.rollback.outputs.web }}=100" --quiet

      - name: Deployment summary
        if: success()
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "### Cloud Run production deployment"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- API revision: \`${{ steps.api.outputs.revision }}\`"
            echo "- Web revision: \`${{ steps.web.outputs.revision }}\`"
            echo "- Maximum instances: \`1\` per service"
          } >> "$GITHUB_STEP_SUMMARY"
