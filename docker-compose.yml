# Локальная инфраструктура (T-006): только переносимые зависимости — ADR-0002.
# Порты и креды совпадают с .env.example; app работает с дефолтами без .env.

name: it-audit-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports:
      # Хост-порт 5433: 5432 занят соседним проектом (leaddrive-uxtest)
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U audit -d audit']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      # Хост-порт 6380: 6379 занят соседним проектом (leaddrive-uxtest)
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # веб-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: создаёт бакет audit-files и завершается.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/audit-files
      "
    restart: 'no'

  # Тестовый LDAP (T-025): заменитель локального AD on-prem клиента.
  # Base DN dc=demo,dc=io из LDAP_DOMAIN; сид-юзеры — infra/ldap/*.ldif
  # (--copy-service применяет их при первом старте; правки = пересоздать контейнер).
  ldap:
    image: osixia/openldap:1.5.0
    command: [--copy-service]
    environment:
      LDAP_ORGANISATION: Demo Group
      LDAP_DOMAIN: demo.io
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - '1389:389' # хост-порт непривилегированный; внутри стандартный 389
    volumes:
      - ./infra/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ldapsearch -x -H ldap://localhost -D cn=admin,dc=demo,dc=io -w admin -b dc=demo,dc=io -s base >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # Тестовый IdP для SSO (T-016 OIDC, позже T-024 SAML). Дев-режим, in-memory H2.
  # Realm it-audit импортируется из infra/keycloak при старте (идемпотентно).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8081:8080' # админка: http://localhost:8081 (admin/admin)
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # в образе нет curl/wget — health через bash /dev/tcp на management-порт 9000
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 40

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # веб-UI писем
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
